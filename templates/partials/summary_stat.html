<div class="queue-summary-card no-link">
  <div class="queue-summary-top">
    <span class="queue-summary-label">{{ label }}</span>
    <span class="badge {{ badge_class|default:'info' }}">{{ value }}{% if suffix %} {{ suffix }}{% endif %}</span>
  </div>
  {% if note %}
    <div class="queue-summary-note">{{ note }}</div>
  {% endif %}
</div>
