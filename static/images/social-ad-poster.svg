<svg width="1080" height="1350" viewBox="0 0 1080 1350" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1080" y2="1350" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#071126"/>
      <stop offset="0.48" stop-color="#0A1833"/>
      <stop offset="1" stop-color="#050B18"/>
    </linearGradient>
    <linearGradient id="accent" x1="220" y1="130" x2="860" y2="1180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#46A7FF"/>
      <stop offset="0.5" stop-color="#58D8FF"/>
      <stop offset="1" stop-color="#39E6A3"/>
    </linearGradient>
    <linearGradient id="card" x1="160" y1="230" x2="920" y2="1160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="rgba(16,30,59,0.82)"/>
      <stop offset="1" stop-color="rgba(8,16,34,0.92)"/>
    </linearGradient>
    <linearGradient id="button" x1="260" y1="920" x2="820" y2="1040" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#46A7FF"/>
      <stop offset="1" stop-color="#39E6A3"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.27 0 0 0 0 0.74 0 0 0 0 1 0 0 0 0.6 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#03070F" flood-opacity="0.55"/>
    </filter>
    <style>
      .title { font: 700 54px/0.98 Arial, Helvetica, sans-serif; fill: #F5F8FF; letter-spacing: -1px; }
      .subtitle { font: 400 17px/1.35 Arial, Helvetica, sans-serif; fill: rgba(235,242,255,0.82); }
      .eyebrow { font: 700 18px/1 Arial, Helvetica, sans-serif; fill: #58D8FF; letter-spacing: 3px; }
      .sectionLabel { font: 700 16px/1 Arial, Helvetica, sans-serif; fill: rgba(234,241,255,0.62); letter-spacing: 1.8px; }
      .sectionValue { font: 600 18px/1 Arial, Helvetica, sans-serif; fill: #F5F8FF; }
      .planName { font: 400 12px/1 Arial, Helvetica, sans-serif; fill: #F6FAFF; }
      .planRate { font: 500 14px/1 Arial, Helvetica, sans-serif; fill: #58D8FF; }
      .planMeta { font: 400 8px/1 Arial, Helvetica, sans-serif; fill: rgba(235,242,255,0.64); letter-spacing: 0.6px; }
      .planBox { fill: rgba(10,20,44,0.82); stroke: rgba(70,167,255,0.18); }
      .planBoxWarm { fill: rgba(20,18,10,0.34); stroke: rgba(255,188,92,0.22); }
      .planBoxSoft { fill: rgba(12,22,38,0.78); stroke: rgba(82,180,255,0.18); }
      .cta { font: 700 17px/1 Arial, Helvetica, sans-serif; fill: #071126; letter-spacing: 0.2px; }
      .micro { font: 600 13px/1.3 Arial, Helvetica, sans-serif; fill: rgba(231,239,255,0.72); }
      .badge { font: 700 12px/1 Arial, Helvetica, sans-serif; fill: #BEEBFF; letter-spacing: 1.6px; }
      .chip { font: 600 12px/1 Arial, Helvetica, sans-serif; fill: #F4FAFF; }
    </style>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>
  <circle cx="860" cy="180" r="180" fill="#46A7FF" opacity="0.14" filter="url(#glow)"/>
  <circle cx="180" cy="1120" r="220" fill="#39E6A3" opacity="0.10" filter="url(#glow)"/>
  <path d="M0 1040C160 960 264 980 410 1048C566 1120 712 1140 1080 1010V1350H0V1040Z" fill="#08101E"/>
  <path d="M0 240C162 162 272 146 432 206C594 266 714 286 1080 146V0H0V240Z" fill="#091427"/>

  <g opacity="0.38">
    <circle cx="190" cy="180" r="2.5" fill="#7AE7FF"/>
    <circle cx="224" cy="212" r="2.2" fill="#39E6A3"/>
    <circle cx="318" cy="144" r="1.8" fill="#B9CCFF"/>
    <circle cx="848" cy="250" r="2.4" fill="#7AE7FF"/>
    <circle cx="922" cy="322" r="1.9" fill="#39E6A3"/>
    <circle cx="816" cy="1120" r="2.3" fill="#7AE7FF"/>
    <circle cx="160" cy="996" r="1.8" fill="#39E6A3"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="84" y="92" width="912" height="1166" rx="42" fill="url(#card)" stroke="rgba(103,155,255,0.18)"/>
  </g>

  <g transform="translate(126 132)">
    <image href="nephix-logo-metallic.png" x="0" y="0" width="92" height="92" preserveAspectRatio="xMidYMid meet"/>
    <text x="108" y="30" class="eyebrow">NEPHIX INVEST</text>
    <text x="108" y="62" class="micro">Investment Suite</text>
  </g>

  <g transform="translate(126 272)">
    <text x="0" y="0" class="title">Grow with clarity.</text>
    <text x="0" y="42" class="title">Invest with confidence.</text>
    <text x="0" y="92" class="subtitle">Explore plan growth, track wallet activity, and manage every move in one secure place.</text>
    <text x="0" y="120" class="subtitle">Built for clean decisions, smooth flows, and a premium investor experience.</text>
  </g>

  <g transform="translate(126 560)">
    <text x="0" y="0" class="sectionLabel">PLANS WITH GROWTH</text>
    <text x="0" y="36" class="sectionValue">Choose a plan that matches your momentum</text>

    <g transform="translate(0 54)">
      <rect x="0" y="0" width="246" height="100" rx="16" class="planBoxSoft"/>
      <text x="14" y="20" class="planMeta">STARTER PLAN</text>
      <text x="14" y="40" class="planRate">2.00% DAILY</text>
      <text x="14" y="58" class="planName">21 DAYS</text>
      <text x="14" y="82" class="micro">Minimum: 100 USD</text>

      <rect x="274" y="0" width="246" height="100" rx="16" class="planBoxSoft"/>
      <text x="288" y="20" class="planMeta">BASIC PLAN</text>
      <text x="288" y="40" class="planRate">3.00% DAILY</text>
      <text x="288" y="58" class="planName">30 DAYS</text>
      <text x="288" y="82" class="micro">Minimum: 300 USD</text>

      <rect x="548" y="0" width="246" height="100" rx="16" class="planBoxSoft"/>
      <text x="562" y="20" class="planMeta">SILVER PLAN</text>
      <text x="562" y="40" class="planRate">5.00% DAILY</text>
      <text x="562" y="58" class="planName">60 DAYS</text>
      <text x="562" y="82" class="micro">Minimum: 500 USD</text>
    </g>

    <g transform="translate(0 166)">
      <rect x="0" y="0" width="246" height="100" rx="16" class="planBoxWarm"/>
      <text x="14" y="20" class="planMeta">GOLD PLAN</text>
      <text x="14" y="40" class="planRate">10.00% DAILY</text>
      <text x="14" y="58" class="planName">60 DAYS</text>
      <text x="14" y="82" class="micro">Minimum: 1000 USD</text>

      <rect x="274" y="0" width="246" height="100" rx="16" class="planBoxSoft"/>
      <text x="288" y="20" class="planMeta">PLATINUM PLAN</text>
      <text x="288" y="40" class="planRate">12.50% DAILY</text>
      <text x="288" y="58" class="planName">90 DAYS</text>
      <text x="288" y="82" class="micro">Minimum: 2500 USD</text>

      <rect x="548" y="0" width="246" height="100" rx="16" class="planBoxWarm"/>
      <text x="562" y="20" class="planMeta">VIP PLAN</text>
      <text x="562" y="40" class="planRate">15.00% DAILY</text>
      <text x="562" y="58" class="planName">120 DAYS</text>
      <text x="562" y="82" class="micro">Minimum: 10000 USD</text>
    </g>
  </g>

  <g transform="translate(126 908)">
    <rect x="0" y="0" width="248" height="82" rx="18" fill="rgba(12,23,48,0.72)" stroke="rgba(70,167,255,0.28)"/>
    <text x="18" y="28" class="badge">FAST SETUP</text>
    <text x="18" y="54" class="chip">Create your account</text>
  </g>
  <g transform="translate(394 908)">
    <rect x="0" y="0" width="248" height="82" rx="18" fill="rgba(12,23,48,0.72)" stroke="rgba(70,167,255,0.28)"/>
    <text x="18" y="28" class="badge">SECURE FLOW</text>
    <text x="18" y="54" class="chip">Deposit, invest, withdraw</text>
  </g>
  <g transform="translate(662 908)">
    <rect x="0" y="0" width="248" height="82" rx="18" fill="rgba(12,23,48,0.72)" stroke="rgba(70,167,255,0.28)"/>
    <text x="18" y="28" class="badge">LIVE SUPPORT</text>
    <text x="18" y="54" class="chip">Get help when you need it</text>
  </g>

  <g transform="translate(126 1072)">
    <rect x="0" y="0" width="828" height="98" rx="28" fill="url(#button)" filter="url(#glow)"/>
    <rect x="14" y="12" width="800" height="74" rx="22" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.09)"/>
    <text x="414" y="34" text-anchor="middle" class="cta">REGISTER AND EARN 50 USD WELCOME BONUS</text>
    <text x="414" y="58" text-anchor="middle" class="micro" fill="#071126">Fast signup. Simple start. Bonus ready when you join.</text>
  </g>

</svg>
